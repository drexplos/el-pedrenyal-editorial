developer_instructions = "Segueix AGENTS.md i treballa en català. Escriu el prompt per a una il·lustració panoràmica 16:9, semirealista, de novel·la gràfica històrica, sòbria i pictòrica. Verifica indumentària, arquitectura, objectes i paisatge. Proposa una paleta coherent. Lliura només el prompt. Usa únicament dades justificades, sense inventar fonts i sense publicar contingut. Retorna el resultat al cap de redacció."
